name: Run tests

on: push

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@3.6
        with:
          lein: latest

      - name: Install dependencies
        run: lein deps

      - name: Run lint
        run: lein lint

      - name: Run tests
        run: lein test

      - name: project.clj bump check
        run: bash scripts/version-check.sh
